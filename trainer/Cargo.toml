[package]
name = "trainer"
version = "0.1.0"
edition = "2024"
publish = false

# not part of the engine, which stays without dependencies: built on its own, from
# this directory

[features]
default = ["metal"]
metal = ["bullet/metal"]
cuda = ["bullet/cuda"]
rocm = ["bullet/rocm"]

[dependencies]
bullet = { git = "https://github.com/jw1912/bullet", rev = "579b78b37a694cacd6e9ede4706386c15c34837c", package = "bullet_lib" }
